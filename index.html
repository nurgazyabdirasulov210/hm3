<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Figure</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: #e8ecf5;
      }
      video,
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video {
        object-fit: cover;
        transform: scaleX(-1);
        filter: brightness(0.55) saturate(0.85);
      }
      #scene {
        will-change: filter;
      }
      #hud {
        position: fixed;
        left: 20px;
        right: 20px;
        bottom: 18px;
        font-size: 13px;
        letter-spacing: 0.02em;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 6px #000;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 18px;
        padding: 24px;
        pointer-events: none;
        text-shadow: 0 1px 12px #000;
        transition: opacity 0.4s;
      }
    </style>
  </head>
  <body>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="skeleton"></canvas>
    <canvas id="scene"></canvas>
    <div id="status">Загрузка модели и камеры…</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
